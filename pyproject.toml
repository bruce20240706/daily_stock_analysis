[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantpick"
version = "0.1.0"
description = "Personal A-share / HK stock screening tool: rule-based quant scoring with a pluggable AI-enhancement layer"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Bruce", email = "bruce20240706@gmail.com" }]
keywords = ["quant", "stock-screening", "a-share", "hk-stock", "technical-analysis"]

# Core runtime dependencies. Heavy/optional backends live in [optional-dependencies]
# and are lazily imported, so `import quantpick` and `quantpick --help` only need these.
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "pandas-ta>=0.3.14b0",
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.0",
    "pyarrow>=14.0",
    "akshare>=1.12",
]

[project.optional-dependencies]
baostock = ["baostock>=0.8.8"]            # A-share historical data fallback
adata = ["adata>=2.0"]                     # A-share multi-source resilient fallback
ai = ["anthropic>=0.40", "openai>=1.40"]   # AI layer: Claude + OpenAI-compatible (DeepSeek/Qwen)
talib = ["TA-Lib>=0.4.28"]                 # faster C indicators + candlestick patterns
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
quantpick = "quantpick.cli:main"

[tool.setuptools.packages.find]
include = ["quantpick*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
